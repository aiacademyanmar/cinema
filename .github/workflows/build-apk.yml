name: Build AAII Cinema V2.2 Native APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout Android project
        uses: actions/checkout@v4

      - name: Source and catalog preflight
        run: python3 scripts/validate_project.py

      - name: Validate Kotlin compiler source layout
        run: |
          test -f app/src/main/java/asia/aaii/cinema/MainActivity.kt
          test -s app/src/main/res/drawable-nodpi/cinema_mark.jpg

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses and install SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Assemble native debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace --warning-mode all :app:assembleDebug 2>&1 | tee build-log.txt

      - name: Verify APK file and checksum
        shell: bash
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee APK_SHA256.txt
          echo '### AAII CINEMA V2.2 native APK compiled' >> "$GITHUB_STEP_SUMMARY"
          cat APK_SHA256.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AAII-CINEMA-V2.2-DEBUG-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            APK_SHA256.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log for troubleshooting
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AAII-CINEMA-V2.2-BUILD-LOG
          path: build-log.txt
          if-no-files-found: ignore
          retention-days: 7